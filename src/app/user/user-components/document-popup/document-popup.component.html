<div class="w-full contain-content h-full max-w-lg p-6 pt-2 bg-white rounded-lg shadow-lg relative">
  <button (click)="onCancel()" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600">
    <i class="fas fa-times text-lg"></i>
  </button>

  

  <!-- ====== Document Form ====== -->
  <h2 *ngIf="formType === 'document'" class="mb-2 text-3xl font-bold text-center text-customBlue poppins-bold">
    Créer un Document
  </h2>
  <form *ngIf="formType === 'document'" class="space-y-3" [formGroup]="documentForm" (ngSubmit)="onSubmit()">
    <div class="flex justify-center mb-4">
      <img src="assets/img/docImage.png" alt="Document" class="w-full h-48 object-cover rounded-md" />
    </div>
    <!-- Bouton de suppression si modification -->
    <div *ngIf="isEditMode" class="flex justify-end mb-2">
      <button type="button" class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-800 flex items-center min-w-[120px] justify-center" (click)="confirmDeleteDocument(data.document)" [disabled]="isDeletingDocument">
        <ng-container *ngIf="!isDeletingDocument">
          <i class="fas fa-trash-alt mr-2"></i> Supprimer
        </ng-container>
        <mat-spinner *ngIf="isDeletingDocument" [diameter]="20" class="ml-2"></mat-spinner>
      </button>
    </div>

    <div>
      <label class="block mb-1">Nom du document</label>
      <input formControlName="title" type="text" placeholder="Nom du document"
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-customBlue"
             [ngClass]="{'border-red-500': submittedDocument && documentFormControl['title'].invalid}" />
      <small class="text-red-600" *ngIf="submittedDocument && documentFormControl['title'].errors?.['required']">
        Champ requis
      </small>
    </div>

    <div>
      <label class="block mb-1">Fichier</label>
      <input type="file" (change)="onFileSelected($event)"
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-customBlue"
             [ngClass]="{'border-red-500': submittedDocument && documentFormControl['file'].invalid}" />
      <small class="text-red-600" *ngIf="submittedDocument && documentFormControl['file'].errors?.['required']">
        Champ requis
      </small>
    </div>

    <button type="submit" class="w-full py-2 mt-2 text-white bg-customBlue rounded hover:bg-blue-700 flex items-center justify-center"
            [disabled]="documentForm.invalid || isLoading">
      <span *ngIf="!isLoading">Ajouter</span>
      <mat-spinner *ngIf="isLoading" [diameter]="24" class="ml-2"></mat-spinner>
    </button>
  </form>

  <!-- ====== Collaborator Form ====== -->
  <h2 *ngIf="formType === 'collaborator'" class="mb-2 text-2xl font-bold text-center text-customBlue">
    {{ isEditMode ? 'Modifier un Collaborateur' : 'Ajouter un Collaborateur' }}
  </h2>
<form *ngIf="formType === 'collaborator'" class="space-y-1" [formGroup]="collaboratorForm" (ngSubmit)="onSubmit()">
    <div class="flex justify-center mb-4">
      <img src="assets/img/colImage2.jpg" alt="Header Image" class="w-full h-52 bg-cover object-cover" />
    </div>
    <div class="step" [class.active]="currentStep === 5">
      <div class="text-center text-customBlue mb-2">
        <h3 class="text-xl font-semibold">
          <i class="fas fa-chevron-circle-left"></i> Step 5 : Collaborators <i class="fas fa-chevron-circle-right"></i>
        </h3>
      </div>

      <div class="form-group mb-1">
        <label for="email" class="mb-1">Email du Collaborateur</label>
        <div class="flex gap-2">
          <input
            formControlName="email"
            type="email"
            id="email"
            placeholder="Email du Collaborateur"
            class="w-full px-2 py-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-customBlue"
            [ngClass]="{'border-red-500': submittedCollaborator && collaboratorFormControl['email'].invalid}"
          />
          <small class="text-red-600" *ngIf="submittedCollaborator && collaboratorFormControl['email'].errors?.['required']">
            Email requis
          </small>
          <small class="text-red-600" *ngIf="submittedCollaborator && collaboratorFormControl['email'].errors?.['email']">
            Email invalide
          </small>
          <button type="button" (click)="onCollaboratorEmailInput()" class="px-3 py-1 bg-customBlue text-white rounded hover:bg-customBlue-dark flex items-center justify-center">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>

      <div class="form-group mb-1">
        <label for="name" class="mb-1">Nom du Collaborateur</label>
        <input
          formControlName="name"
          type="text"
          id="name"
          placeholder="Nom du Collaborateur"
          [readonly]="foundUser"
          class="w-full px-2 py-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-customBlue bg-gray-100"
        />
      </div>


      <div class="flex justify-between mt-3">
        <button
          type="submit"
          class="px-4 py-2 text-white bg-customBlue rounded-lg hover:bg-customBlue-dark disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center justify-center"
          [disabled]="collaboratorForm.invalid || isLoading || (showPasswordField && !collaboratorForm.value.password)"
        >
          <span *ngIf="!isLoading"><i class="fas fa-plus"></i> Add</span>
          <mat-spinner *ngIf="isLoading" [diameter]="24" class="ml-2"></mat-spinner>
        </button>
      </div>
    </div>
  </form>


  <!-- ====== Supervisor Form ====== -->
  <h2 *ngIf="formType === 'supervisor'" class="mb-2 text-2xl font-bold text-center text-customBlue">
    Ajouter un Superviseur
  </h2>
  <form *ngIf="formType === 'supervisor'" class="space-y-3" [formGroup]="supervisorForm" (ngSubmit)="onSubmit()">
    <div class="flex justify-center mb-4">
      <img src="assets/img/supervisor.jpg" alt="Superviseur" class="w-full h-52 object-cover rounded-md" />
    </div>

    <div>
      <label class="block mb-1">Nom</label>
      <input formControlName="name" type="text" placeholder="Nom du superviseur"
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-customBlue"
             [ngClass]="{'border-red-500': submittedSupervisor && supervisorFormControl['name'].invalid}" />
      <small class="text-red-600" *ngIf="submittedSupervisor && supervisorFormControl['name'].errors?.['required']">
        Champ requis
      </small>
    </div>

    <div>
      <label class="block mb-1">Email</label>
      <input formControlName="email" type="email" placeholder="Email"
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-customBlue"
             [ngClass]="{'border-red-500': submittedSupervisor && supervisorFormControl['email'].invalid}" />
      <small class="text-red-600" *ngIf="submittedSupervisor && supervisorFormControl['email'].errors?.['required']">
        Champ requis
      </small>
      <small class="text-red-600" *ngIf="submittedSupervisor && supervisorFormControl['email'].errors?.['email']">
        Email invalide
      </small>
    </div>

    <button type="submit" class="w-full py-2 mt-2 text-white bg-customBlue rounded hover:bg-blue-700"
            [disabled]="supervisorForm.invalid">
      Ajouter
    </button>
  </form>
</div>

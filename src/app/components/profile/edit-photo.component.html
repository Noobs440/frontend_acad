<div class="edit-photo-container">
  <h3>Modifier la photo de profil</h3>

  <div class="photo-preview" style="position: relative; display: inline-block;">
    <img
      [src]="previewUrl ? previewUrl : photoUrl"
      alt="Photo de profil"
      class="profile-photo"
      style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover;"
    />
    <label class="camera-icon" style="position: absolute; bottom: 10px; right: 10px; cursor: pointer;">
      📷
      <input type="file" accept="image/*" (change)="onFileChange($event)" hidden />
    </label>
  </div>

  <button (click)="submit()" [disabled]="!selectedFile" class="submit-btn">
    Enregistrer
  </button>

  <p *ngIf="message" class="message">{{ message }}</p>
</div>

<div class="collaborator-list">

  <div class="controls">
    <select [(ngModel)]="searchField" (change)="applyFilters()">
      <option value="nom_collab">Nom</option>
      <option value="email_collab">Email</option>
      <option value="tbl_projet_id">Projet</option>
    </select>
    <input type="text" placeholder="Recherche" [(ngModel)]="searchTerm" (input)="onSearchChange()" />
    <button (click)="toggleSort()">
      Trier: {{ sortAsc ? 'A → Z' : 'Z → A' }}
    </button>
    <button (click)="openAddModal()">Ajouter un collaborateur</button>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Projet</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let collab of filteredCollaborators">
        <td>{{ collab.nom_collab }}</td>
        <td>{{ collab.email_collab }}</td>
        <td>{{ collab.tbl_projet_id }}</td>
        <td>
          <button (click)="openEditModal(collab)">Modifier</button>
          <button (click)="deleteCollaborator(collab.id)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">Précédent</button>
    <span>Page {{ currentPage }} / {{ totalPages }}</span>
    <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">Suivant</button>
  </div>

  <!-- Modal -->
  <div class="modal" *ngIf="isModalOpen">
    <div class="modal-content">
      <h3>{{ isEditMode ? 'Modifier collaborateur' : 'Ajouter collaborateur' }}</h3>

      <label>
        Nom:
        <input type="text" [(ngModel)]="currentCollaborator.nom_collab" />
      </label>

      <label>
        Email:
        <input type="email" [(ngModel)]="currentCollaborator.email_collab" (input)="onEmailSearch($event)" />
      </label>
      <ul *ngIf="userSuggestions.length">
        <li *ngFor="let u of userSuggestions" (click)="selectUser(u)">
          {{ u.nom }} - {{ u.email }}
        </li>
      </ul>

      <label>
        Projet:
        <input type="text" [(ngModel)]="currentCollaborator.tbl_projet_id" (input)="onProjectSearch($event)" />
      </label>
      <ul *ngIf="projectSuggestions.length">
        <li *ngFor="let p of projectSuggestions" (click)="selectProject(p)">
          {{ p.titre_projet }}
        </li>
      </ul>

      <div class="modal-actions">
        <button (click)="saveCollaborator()" [disabled]="isSaving">
          <span *ngIf="!isSaving">{{ isEditMode ? 'Enregistrer' : 'Ajouter' }}</span>
          <span *ngIf="isSaving"><i class="spinner"></i> Chargement...</span>
        </button>
        <button (click)="closeModal()" [disabled]="isSaving">Annuler</button>
      </div>
    </div>
  </div>

</div>

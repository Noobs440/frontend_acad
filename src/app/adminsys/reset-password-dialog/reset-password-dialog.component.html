<h2 mat-dialog-title>Réinitialiser le mot de passe</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="fill">
      <mat-label>Nouveau mot de passe</mat-label>
      <input matInput type="password" formControlName="password">
      <mat-error *ngIf="form.controls['password'].invalid">Minimum 6 caractères</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
    Réinitialiser
  </button>
</mat-dialog-actions>

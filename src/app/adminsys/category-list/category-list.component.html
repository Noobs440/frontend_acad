<div class="category-list">

  <div class="controls">
    <select [(ngModel)]="searchField" (change)="applyFilters()">
      <option value="nom_cat">Nom</option>
      <option value="descript_cat">Description</option>
    </select>
    <input type="text" placeholder="Recherche" [(ngModel)]="searchTerm" (input)="onSearchChange()" />

    <button (click)="toggleSort()">
      Trier: {{ sortAsc ? 'A → Z' : 'Z → A' }}
    </button>

    <button (click)="openAddModal()">Ajouter un Domaine</button>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cat of filteredCategories">
        <td>{{ cat.nom_cat }}</td>
        <td>{{ cat.descript_cat || '-' }}</td>
        <td>
          <!-- Bouton Modifier -->
          <button (click)="openEditModal(cat)">
            <span class="spinner" *ngIf="editingId === cat.id"></span>
            Modifier
          </button>

          <!-- Bouton Supprimer -->
          <button 
            (click)="openDeleteConfirm(cat.id!)" 
            [disabled]="isDeleting && deletingId === cat.id">
            <span *ngIf="isDeleting && deletingId === cat.id" class="spinner"></span>
            {{ isDeleting && deletingId === cat.id ? 'Suppression...' : 'Supprimer' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">Précédent</button>
    <span>Page {{ currentPage }} / {{ totalPages }}</span>
    <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">Suivant</button>
  </div>

  <!-- Modal ajout/modif -->
  <div class="modal" *ngIf="isModalOpen">
    <div class="modal-content">
      <h3>{{ isEditMode ? 'Modifier Domaine' : 'Ajouter Domaine' }}</h3>

      <label>
        Nom:
        <input type="text" [(ngModel)]="currentCategory.nom_cat" />
      </label>

      <label>
        Description:
        <textarea [(ngModel)]="currentCategory.descript_cat"></textarea>
      </label>

      <label>
        Icône:
        <input type="file" (change)="onFileSelected($event)" accept="image/*" />
        <span>l'image doit être de type .svg, .png, .ico, .jpg ou .jpeg</span>
      </label>

      <div class="modal-actions">
        <button (click)="saveCategory()" [disabled]="isSaving">
          <span *ngIf="isSaving" class="spinner"></span>
          {{ isSaving ? 'En cours...' : (isEditMode ? 'Enregistrer' : 'Ajouter') }}
        </button>
        <button (click)="closeModal()" [disabled]="isSaving">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Modal confirmation suppression -->
  <div class="modal" *ngIf="isDeleteConfirmOpen">
    <div class="modal-content">
      <h3>Confirmer la suppression</h3>
      <p>Voulez-vous vraiment supprimer ce Domaine ?</p>
      <div class="modal-actions">
        <button (click)="confirmDelete()" [disabled]="isDeleting">
          <span *ngIf="isDeleting" class="spinner"></span>
          {{ isDeleting ? 'Suppression...' : 'Oui' }}
        </button>
        <button (click)="cancelDelete()" [disabled]="isDeleting">Non</button>
      </div>
    </div>
  </div>

</div>

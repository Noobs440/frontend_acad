<div class="filiere-list">

  <div class="controls">
    <input type="text" placeholder="Recherche par nom" [(ngModel)]="searchTerm" (input)="onSearchChange()" />
    <button (click)="toggleSort()">
      Trier: {{ sortAsc ? 'A → Z' : 'Z → A' }}
    </button>
    <button (click)="openAddModal()">Ajouter une filière</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Nom</th>
        <th>Faculté</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let fil of filteredFilieres">
        <td>{{ fil.nom_fil }}</td>
        <td>{{ getFacultyName(fil.tbl_faculte_id) }}</td>
        <td>
          <button (click)="openEditModal(fil)">Modifier</button>
          <button (click)="openConfirmDelete(fil)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">Précédent</button>
    <span>Page {{ currentPage }} / {{ totalPages }}</span>
    <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">Suivant</button>
  </div>

  <!-- Modal ajout/modif -->
  <div class="modal-backdrop" *ngIf="isModalOpen">
    <div class="modal">
      <h3>{{ isEditMode ? 'Modifier filière' : 'Ajouter filière' }}</h3>

      <label>
        Nom:
        <input type="text" [(ngModel)]="currentFiliere.nom_fil" />
      </label>

      <label>
        Faculté:
        <select [(ngModel)]="currentFiliere.tbl_faculte_id">
          <option *ngFor="let fac of faculties" [value]="fac.id">
            {{ fac.nom_fac }}
          </option>
        </select>
      </label>

      <div class="modal-actions">
        <button (click)="saveFiliere()">
          {{ isEditMode ? 'Enregistrer' : 'Ajouter' }}
        </button>
        <button (click)="closeModal()">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Modal confirmation suppression -->
  <div class="modal-backdrop" *ngIf="showConfirmDeleteModal">
    <div class="modal">
      <p>Voulez-vous vraiment supprimer la filière <strong>{{ filiereToDelete?.nom_fil }}</strong> ?</p>
      <div class="modal-actions">
        <button (click)="confirmDelete()">Oui, supprimer</button>
        <button (click)="cancelDelete()">Annuler</button>
      </div>
    </div>
  </div>

</div>

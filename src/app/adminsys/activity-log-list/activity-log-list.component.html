<div class="container mt-4">
  <h2>Historique des activités</h2>

  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>Date</th>
        <th>Utilisateur</th>
        <th>Action</th>
        <th>Ressource</th>
        <th>Modifications</th>
        <th>IP</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let log of logs">
        <td>{{ log.created_at | date:'short' }}</td>
        <td>{{ log.user?.name || 'Système' }}</td>
        <td>{{ log.event | titlecase }}</td>
        <td>{{ getResourceLabel(log) }}</td>
        <td>{{ getChanges(log) }}</td>
        <td>{{ log.ip_address }}</td>
      </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-between">
    <button class="btn btn-secondary" [disabled]="currentPage === 1"
            (click)="loadLogs(currentPage - 1)">Précédent</button>
    <span>Page {{ currentPage }} / {{ totalPages }}</span>
    <button class="btn btn-secondary" [disabled]="currentPage === totalPages"
            (click)="loadLogs(currentPage + 1)">Suivant</button>
  </div>
</div>

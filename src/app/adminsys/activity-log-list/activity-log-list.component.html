<div class="container mt-4">
  <h2>Historique des activités</h2>

  <!-- Filtres de recherche -->
  <div class="filters mb-3">
    <input type="text" class="form-control mb-2" placeholder="Rechercher par action" [(ngModel)]="filters.action" (input)="applyFilters()">
    <input type="text" class="form-control mb-2" placeholder="Rechercher par ressource" [(ngModel)]="filters.resource" (input)="applyFilters()">
    <input type="text" class="form-control mb-2" placeholder="Rechercher par modifications" [(ngModel)]="filters.changes" (input)="applyFilters()">
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Action</th>
        <th>Ressource</th>
        <th>Modifications</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let log of filteredLogs">
        <td>{{ log.created_at | date:'short' }}</td>
        <td>{{ log.event | titlecase }}</td>
        <td>{{ getResourceLabel(log) }}</td>
        <td>{{ getChanges(log) }}</td>
      </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-between">
    <button class="btn btn-secondary" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">Précédent</button>
    <span>Page {{ currentPage }} / {{ totalPages }}</span>
    <button class="btn btn-secondary" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">Suivant</button>
  </div>
</div>

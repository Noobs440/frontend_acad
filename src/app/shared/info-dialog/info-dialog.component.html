<div class="info-dialog-container">
  <div class="info-dialog-icon-wrapper" [ngClass]="getIconClass()">
    <mat-icon class="info-dialog-icon" [color]="getIconColor()">{{ getIconName() }}</mat-icon>
  </div>

  <h2 class="info-dialog-title">{{ data.title }}</h2>

  <div class="info-dialog-message">
    <p>{{ data.message }}</p>
  </div>

  <div class="info-dialog-actions">
    <button 
      mat-raised-button 
      class="btn-primary" 
      mat-dialog-close
      (click)="onClose()">
      {{ data.confirmButtonText || 'OK' }}
    </button>
  </div>
</div>

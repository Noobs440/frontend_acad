<h2 mat-dialog-title>Déconnexion</h2>
<mat-dialog-content>Voulez-vous vraiment vous déconnecter ?</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close="false">Annuler</button>
  <button mat-raised-button color="warn" [mat-dialog-close]="true">Se déconnecter</button>
</mat-dialog-actions>

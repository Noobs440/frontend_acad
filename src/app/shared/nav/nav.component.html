<header id="header" [ngStyle]="{ 'background-color': bgColor }" class="header d-flex align-items-center fixed-top" [class.mobile-nav-active]="mobileNavActive">
  <div class="container-fluid position-relative d-flex align-items-center justify-content-between">

    <a class="logo d-flex align-items-center me-auto me-xl-0" routerLink="/home">
      <img src="assets/img/logo1.jpg" alt="Logo" width="50" height="50" style="border-radius: 50%;" />
      <h1 class="sitename"></h1><span>Dschang's SchoolHub</span>
    </a>

    <nav id="navmenu" class="navmenu">
      <ul>
        <li>
          <a [routerLink]="['/home']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="fas fa-home"></i> Accueil
          </a>
        </li>
        <li>
          <a [routerLink]="['/home/category']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="fas fa-th-list"></i> Domaines
          </a>
        </li>
        <li>
          <a [routerLink]="['/home/levels-listing']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="fas fa-layer-group"></i> Niveaux
          </a>
        </li>
        <li>
          <a [routerLink]="['/home/projects-listing']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="fas fa-project-diagram"></i> Projets
          </a>
        </li>
        <li>
          <a [routerLink]="['/home/contact']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="fas fa-envelope"></i> Contact
          </a>
        </li>
        <li class="nav-item-cta" *ngIf="!isLoggedIn">
          <a class="btn-getstarted" (click)="openDialog()">
            <i class="fas fa-sign-in-alt"></i> Se Connecter
          </a>
        </li>
        <li class="nav-item-cta" *ngIf="isLoggedIn">
          <a class="btn-getstarted" (click)="logout()">
            <i class="fas fa-sign-out-alt"></i> Déconnexion
          </a>
        </li>
      </ul>
    </nav>

    <i class="mobile-nav-toggle d-xl-none bi bi-list" (click)="toggleMobileNav()" aria-label="Toggle navigation" role="button" tabindex="0"></i>

    <!-- CTA moved inside nav list; external CTA removed -->
  </div>
</header>

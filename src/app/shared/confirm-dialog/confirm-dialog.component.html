<div class="confirm-dialog-container">
  <div class="confirm-dialog-icon-wrapper">
    <mat-icon class="confirm-dialog-icon" color="warn">help_outline</mat-icon>
  </div>

  <h2 class="confirm-dialog-title">{{ data.title }}</h2>

  <div class="confirm-dialog-message">
    <p>{{ data.message }}</p>
  </div>

  <div class="confirm-dialog-actions">
    <button 
      mat-button 
      (click)="onCancel()" 
      class="btn-cancel">
      <mat-icon>close</mat-icon>
      <span>Annuler</span>
    </button>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="onConfirm()" 
      class="btn-confirm">
      <mat-icon>check</mat-icon>
      <span>Confirmer</span>
    </button>
  </div>
</div>

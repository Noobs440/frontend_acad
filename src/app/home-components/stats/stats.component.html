<!-- Stats Section -->
<section id="stats" class="stats section">

  <img src="assets/img/stats-bg.jpg" alt="" [@fadeIn]>

  <div class="container position-relative" [@fadeUp]>

    <div class="row gy-4">

      <div class="col-lg-3 col-md-6">
        <div class="stats-item w-100 h-100">
          <p>{{ 'UNIVERSITIES' | translate }}</p>
          <span appCounter [appCounterStart]="0" [appCounterEnd]="universityCount" [appCounterDuration]="1"></span>
        </div>
      </div><!-- End Stats Item -->

      <div class="col-lg-3 col-md-6">
        <div class="stats-item w-100 h-100">
          <p>{{ 'FILIERS' | translate }}</p>
          <span appCounter [appCounterStart]="0" [appCounterEnd]="filiereCount" [appCounterDuration]="1"></span>
        </div>
      </div><!-- End Stats Item -->

      <div class="col-lg-3 col-md-6">
        <div class="stats-item w-100 h-100">
          <p>{{ 'PROJECTS' | translate }}</p>
          <span appCounter [appCounterStart]="0" [appCounterEnd]="projetCount" [appCounterDuration]="1"></span>
        </div>
      </div><!-- End Stats Item -->

      <div class="col-lg-3 col-md-6">
        <div class="stats-item w-100 h-100">
          <p>{{ 'USERS_PER_DAY' | translate }}</p>
          <span [@fadeUp] appCounter [appCounterStart]="0" [appCounterEnd]="26" [appCounterDuration]="1"></span>
        </div>
      </div><!-- End Stats Item -->

    </div>
  </div>
</section><!-- /Stats Section -->
